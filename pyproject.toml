[project]
name = "rag101"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "myriam2005", email = "myriam.kary@etudiant-fst.utm.tn" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag101 = "rag101:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
